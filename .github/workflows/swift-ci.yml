name: Swift CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            swift: 5.10.1
          - os: ubuntu-22.04
            swift: 6.1.1
          - os: macos-latest
            swift: system

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and install Swift toolchain (Linux)
        if: matrix.os == 'ubuntu-22.04' && matrix.swift != 'system'
        run: |
          set -euxo pipefail
          SWIFT_VERSION="${{ matrix.swift }}"
          SWIFT_URL="https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2204/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-ubuntu22.04.tar.gz"
          TMP="$RUNNER_TEMP/swift.tar.gz"
          curl -fSL "$SWIFT_URL" -o "$TMP"
          sudo tar -xzf "$TMP" -C /opt
          DIR=$(tar -tzf "$TMP" | head -1 | cut -f1 -d"/")
          sudo ln -sfn "/opt/$DIR" /opt/swift
          echo "PATH=/opt/swift/usr/bin:$PATH" >> "$GITHUB_ENV"

      - name: Notice for macOS runner
        if: matrix.os == 'macos-latest'
        run: |
          echo "macOS runner: using system Swift (if available)."
          swift --version || true

      - name: Show swift version
        run: swift --version

      - name: Run tests
        run: swift test
